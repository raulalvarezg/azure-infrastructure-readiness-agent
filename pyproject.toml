[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-infrastructure-readiness-agent"
version = "0.1.0"
description = "AI-powered agent that validates Azure infrastructure deployment YAML, detects risks, and recommends corrective actions."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0"
]

[project.scripts]
readiness-agent = "src.cli.main:main"

[tool.setuptools]
packages = { find = { include = ["src*"] } }
